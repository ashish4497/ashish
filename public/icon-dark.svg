<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldTopDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e8ba"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="goldBottomDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e7d23"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#d4af37" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Cushion Shield -->
  <rect width="64" height="64" rx="16" fill="#08090c"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Faceted 8-Point Atelier Star Emblem -->
  <g filter="url(#glowDark)">
    <!-- North Point -->
    <polygon points="32,8 32,32 27,27" fill="url(#goldTopDark)"/>
    <polygon points="32,8 37,27 32,32" fill="url(#goldBottomDark)"/>

    <!-- South Point -->
    <polygon points="32,56 32,32 37,37" fill="url(#goldTopDark)"/>
    <polygon points="32,56 27,37 32,32" fill="url(#goldBottomDark)"/>

    <!-- East Point -->
    <polygon points="56,32 32,32 37,27" fill="url(#goldTopDark)"/>
    <polygon points="56,32 37,37 32,32" fill="url(#goldBottomDark)"/>

    <!-- West Point -->
    <polygon points="8,32 32,32 27,37" fill="url(#goldTopDark)"/>
    <polygon points="8,32 27,27 32,32" fill="url(#goldBottomDark)"/>

    <!-- Diagonal Northeast Point -->
    <polygon points="49,15 32,32 35,23" fill="url(#goldTopDark)"/>
    <polygon points="49,15 41,29 32,32" fill="url(#goldBottomDark)"/>

    <!-- Diagonal Northwest Point -->
    <polygon points="15,15 32,32 23,35" fill="url(#goldTopDark)"/>
    <polygon points="15,15 29,23 32,32" fill="url(#goldBottomDark)"/>

    <!-- Diagonal Southeast Point -->
    <polygon points="49,49 32,32 41,35" fill="url(#goldTopDark)"/>
    <polygon points="49,49 35,41 32,32" fill="url(#goldBottomDark)"/>

    <!-- Diagonal Southwest Point -->
    <polygon points="15,49 32,32 23,41" fill="url(#goldTopDark)"/>
    <polygon points="15,49 29,49 32,32" fill="url(#goldBottomDark)"/>

    <!-- Center Diamond Core -->
    <polygon points="32,26 38,32 32,38 26,32" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="32" r="1.5" fill="#9e7d23"/>
  </g>
</svg>

