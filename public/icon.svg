<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #08090c;
      --border: rgba(212, 175, 55, 0.45);
      --gold-light: #f7e8ba;
      --gold-mid: #d4af37;
      --gold-dark: #9e7d23;
      --core: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fbf9f4;
        --border: rgba(158, 117, 24, 0.45);
        --gold-light: #dfbc5e;
        --gold-mid: #ba8e26;
        --gold-dark: #7a580d;
        --core: #ffffff;
      }
    }
  </style>
  <defs>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-light)"/>
      <stop offset="100%" stop-color="var(--gold-mid)"/>
    </linearGradient>
    <linearGradient id="goldBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gold-mid)"/>
      <stop offset="100%" stop-color="var(--gold-dark)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="var(--gold-mid)" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Cushion Shield -->
  <rect width="64" height="64" rx="16" fill="var(--bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Faceted 8-Point Atelier Star Emblem -->
  <g filter="url(#glow)">
    <!-- North Point -->
    <polygon points="32,8 32,32 27,27" fill="url(#goldTop)"/>
    <polygon points="32,8 37,27 32,32" fill="url(#goldBottom)"/>

    <!-- South Point -->
    <polygon points="32,56 32,32 37,37" fill="url(#goldTop)"/>
    <polygon points="32,56 27,37 32,32" fill="url(#goldBottom)"/>

    <!-- East Point -->
    <polygon points="56,32 32,32 37,27" fill="url(#goldTop)"/>
    <polygon points="56,32 37,37 32,32" fill="url(#goldBottom)"/>

    <!-- West Point -->
    <polygon points="8,32 32,32 27,37" fill="url(#goldTop)"/>
    <polygon points="8,32 27,27 32,32" fill="url(#goldBottom)"/>

    <!-- Diagonal Northeast Point -->
    <polygon points="49,15 32,32 35,23" fill="url(#goldTop)"/>
    <polygon points="49,15 41,29 32,32" fill="url(#goldBottom)"/>

    <!-- Diagonal Northwest Point -->
    <polygon points="15,15 32,32 23,35" fill="url(#goldTop)"/>
    <polygon points="15,15 29,23 32,32" fill="url(#goldBottom)"/>

    <!-- Diagonal Southeast Point -->
    <polygon points="49,49 32,32 41,35" fill="url(#goldTop)"/>
    <polygon points="49,49 35,41 32,32" fill="url(#goldBottom)"/>

    <!-- Diagonal Southwest Point -->
    <polygon points="15,49 32,32 23,41" fill="url(#goldTop)"/>
    <polygon points="15,49 29,49 32,32" fill="url(#goldBottom)"/>

    <!-- Center Diamond Core -->
    <polygon points="32,26 38,32 32,38 26,32" fill="var(--core)" opacity="0.95"/>
    <circle cx="32" cy="32" r="1.5" fill="var(--gold-dark)"/>
  </g>
</svg>

